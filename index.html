<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>himekorock1000 英語学習アプリ</title>
    <style>
        body { font-family: sans-serif; text-align: center; padding: 20px; background: #f4f4f9; }
        .card { background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); display: inline-block; width: 80%; max-width: 400px; }
        button { padding: 10px 20px; font-size: 16px; margin: 10px; cursor: pointer; }
    </style>
</head>
<body>

    <div class="card">
        <h2>himekorock1000</h2>
        <div id="word-display" style="font-size: 24px; font-weight: bold; margin: 20px 0;">読み込み中...</div>
        <div id="meaning-display" style="font-size: 18px; color: #666; margin-bottom: 20px;"></div>
        <button onclick="nextWord()">次の単語</button>
        <button onclick="speakWord()">発音</button>
    </div>

    <!-- 外部データファイルの読み込み -->
    <script src="words.js"></script>
    <script>
        let currentIndex = 0;

        // Android音声対策（初回のタッチで音声エンジンをアンロック）
        let audioUnlocked = false;
        function unlockAudio() {
            if (!audioUnlocked) {
                const utterance = new SpeechSynthesisUtterance("");
                window.speechSynthesis.speak(utterance);
                audioUnlocked = true;
            }
        }

        function showWord() {
            if (typeof himekorock1000 === 'undefined' || himekorock1000.length === 0) {
                document.getElementById('word-display').innerText = "データがありません";
                return;
            }
            const item = himekorock1000[currentIndex];
            document.getElementById('word-display').innerText = item.word;
            document.getElementById('meaning-display').innerText = item.meaning;
        }

        function nextWord() {
            unlockAudio();
            if (typeof himekorock1000 !== 'undefined' && himekorock1000.length > 0) {
                currentIndex = (currentIndex + 1) % himekorock1000.length;
                showWord();
                speakWord();
            }
        }

        function speakWord() {
            unlockAudio();
            if (typeof himekorock1000 !== 'undefined' && himekorock1000.length > 0) {
                const text = himekorock1000[currentIndex].word;
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'en-US';
                window.speechSynthesis.speak(utterance);
            }
        }

        // 初期化
        window.onload = function() {
            showWord();
        };
    </script>
</body>
</html>
